name: App_1 debug APK

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/app1-debug-apk.yml"
      - "android/**"
      - "capacitor.config.ts"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # The app loads the live Vercel site (server.url in capacitor.config.ts),
      # so bundled web assets only need to exist as a placeholder.
      - name: Placeholder web assets
        run: |
          mkdir -p dist/spa
          echo '<!doctype html><title>App_1</title>' > dist/spa/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: App_1 debug APK ${{ github.run_number }}
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk